<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:"Fraunces";font-style:normal;font-weight:300 700;src:url(fontes/fraunces-normal-latin.woff2) format("woff2")}
@font-face{font-family:"Fraunces";font-style:italic;font-weight:300 700;src:url(fontes/fraunces-italic-latin.woff2) format("woff2")}
@font-face{font-family:"Jakarta";font-weight:200 800;src:url(fontes/plus-jakarta-sans-latin.woff2) format("woff2")}
@font-face{font-family:"Unbounded";font-weight:300 900;src:url(fontes/unbounded-normal-latin.woff2) format("woff2")}
html,body{margin:0;background:#000;width:1080px;height:1920px;overflow:hidden}
canvas{position:absolute;inset:0;display:block;width:1080px;height:1920px}
/* véus para leitura do texto (topo e base) */
.veu{position:absolute;left:0;right:0;pointer-events:none}
.veu.t{top:0;height:820px;background:linear-gradient(#02050af0 0%,#02050ab0 45%,#02050a00 100%)}
.veu.b{bottom:0;height:760px;background:linear-gradient(#02050a00,#02050ae0)}
#textos{position:absolute;inset:0;color:#eef4fa;font-family:"Jakarta",sans-serif}
.bloco{position:absolute;left:72px;right:72px;text-align:center}
#textos{transform-origin:50% 45%}
#fundo-tipo{position:absolute;inset:0;background:radial-gradient(90% 55% at 50% 45%,#0f2337 0%,#07111d 55%,#02050a 100%);background-size:100% 130%}
#fundo-tipo::after{content:"";position:absolute;inset:0;opacity:.07;mix-blend-mode:overlay;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
.gigante{font-family:"Fraunces",serif;font-weight:300;font-size:168px;line-height:.95;letter-spacing:-.035em}
.contador{font-family:"Unbounded",sans-serif;font-weight:700;font-size:330px;line-height:1;letter-spacing:-.04em;color:#eef4fa}
.contador .p{transform-origin:50% 60%}
.pontos{display:flex;flex-wrap:wrap;justify-content:center;gap:16px;left:250px;right:250px}
.ponto{width:26px;height:26px;border-radius:50%;border:2px solid #9fd6ff;display:block}
.ponto.on{background:#9fd6ff}
.assinatura{font-family:"Fraunces",serif;font-style:italic;font-weight:300;font-size:54px;color:#9fc6e8}
.p{display:inline-block;white-space:pre;will-change:transform,opacity,filter}
.titulo{font-family:"Fraunces",serif;font-weight:300;font-size:92px;line-height:1.04;letter-spacing:-.02em;text-shadow:0 6px 40px #000c}
.apoio{font-weight:500;font-size:38px;line-height:1.35;color:#b8cadb;text-shadow:0 4px 24px #000}
.selo{font-weight:600;font-size:34px;letter-spacing:.3em;text-transform:uppercase;color:#9fc6e8}
.marca{font-family:"Unbounded",sans-serif;font-weight:700;font-size:112px;letter-spacing:.02em;line-height:1.02}
.cta{font-weight:600;font-size:38px;letter-spacing:.01em;color:#dbe8f4}
.selo .p{white-space:pre}
.cta .p{background:none}
.destaque{font-family:"Fraunces",serif;font-style:italic;font-weight:400}
.destaque.dor{color:#ff4a32;text-shadow:0 0 36px #ff2a1466,0 6px 40px #000c}
.destaque.alivio{color:#9fd6ff;text-shadow:0 0 36px #6fbaff55,0 6px 40px #000c}
.destaque.ouro{color:#f3c98b}
</style></head>
<body><div id="fundo-tipo"></div><canvas id="gl" width="1080" height="1920"></canvas><div class="veu t"></div><div class="veu b"></div><div id="escuro" style="position:absolute;inset:0;background:#000;opacity:0"></div><div id="textos"></div><script src="cena.js"></script></body></html>
