<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:"Instrument Serif";src:url(fontes/instrument-normal-400-latin.woff2) format("woff2");font-style:normal}
@font-face{font-family:"Instrument Serif";src:url(fontes/instrument-italic-400-latin.woff2) format("woff2");font-style:italic}
@font-face{font-family:"Plex Mono";src:url(fontes/plexmono-400.woff2) format("woff2");font-weight:400}
@font-face{font-family:"Plex Mono";src:url(fontes/plexmono-500.woff2) format("woff2");font-weight:500}
:root{--papel:#ece7dd;--tinta:#151412;--cinza:#6e6a62;--oxido:#8a3b23}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:var(--papel)}
#palco{position:relative;width:1080px;height:1920px;overflow:hidden;background:var(--papel);color:var(--tinta)}
.cena{position:absolute;inset:0;display:none}
.cena.on{display:block}
.full{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.serif{font-family:"Instrument Serif",serif;font-weight:400;letter-spacing:-.01em}
.mono{font-family:"Plex Mono",monospace;font-weight:500;text-transform:uppercase;letter-spacing:.14em;font-size:22px}
.selo{position:absolute;background:var(--papel);color:var(--tinta);padding:18px 24px 20px}
.selo .mono{font-size:19px;color:var(--cinza)}
.selo .serif{font-size:46px;line-height:1.05;margin-top:8px;font-style:italic}
.topo{position:absolute;left:64px;right:64px;top:64px;display:flex;justify-content:space-between;align-items:center}
.topo .mono{font-size:20px}
.linha{display:block;overflow:hidden;padding-bottom:.08em}
.linha>span{display:inline-block;will-change:transform}
.regua{position:absolute;left:64px;right:64px;height:2px;background:var(--tinta)}
.grao{position:absolute;inset:-50%;pointer-events:none;opacity:.07;mix-blend-mode:multiply;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='300' height='300'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
</style></head>
<body><div id="palco"></div>
<script>
const P = new URLSearchParams(location.search);
const L = P.get('l') || 'pt';
const FPS = 30;
const T = {
  pt: {
    marca: 'Eduardo Borges', oficio: 'Web design',
    titulo: ['Eduardo', 'Borges'], sub: 'Web designer.', subMono: 'Brasil — sites para negócios em Portugal e na Europa',
    c1: ['Cada site começa', 'do zero.'], c1b: 'Nada de modelos prontos.',
    pl: ['Casamentos — Funchal, Madeira', 'Home staging — Porto', 'Relojoaria — conceito 3D', 'Cerimonial — Brasil', 'Móveis por medida — Brasil', 'Decoração de festas — Barcelos'],
    c2: ['Pedidos de orçamento', 'direto no WhatsApp.'],
    b: [['Ser encontrado', 'no Google.'], ['Passar confiança', 'antes do primeiro contacto.'], ['Transformar visitas', 'em clientes.']],
    fim: ['Vamos criar', 'o vosso?'], fimSub: 'Responda a esta mensagem.',
  },
  en: {
    marca: 'Eduardo Borges', oficio: 'Web design',
    titulo: ['Eduardo', 'Borges'], sub: 'Web designer.', subMono: 'Brazil — websites for businesses across Europe',
    c1: ['Every website starts', 'from scratch.'], c1b: 'No ready-made templates.',
    pl: ['Weddings — Funchal, Madeira', 'Home staging — Porto', 'Watchmaking — 3D concept', 'Wedding planning — Brazil', 'Bespoke furniture — Brazil', 'Party styling — Barcelos'],
    c2: ['Quote requests', 'straight to WhatsApp.'],
    b: [['Get found', 'on Google.'], ['Build trust', 'before the first call.'], ['Turn visitors', 'into clients.']],
    fim: ['Shall we build', 'yours?'], fimSub: 'Just reply to this message.',
  },
  fr: {
    marca: 'Eduardo Borges', oficio: 'Web design',
    titulo: ['Eduardo', 'Borges'], sub: 'Web designer.', subMono: 'Brésil — sites pour entreprises en Europe',
    c1: ['Chaque site part', 'de zéro.'], c1b: 'Aucun modèle tout fait.',
    pl: ['Mariages — Funchal, Madère', 'Home staging — Porto', 'Horlogerie — concept 3D', 'Wedding planner — Brésil', 'Mobilier sur mesure — Brésil', 'Décoration de fêtes — Barcelos'],
    c2: ['Demandes de devis', 'directement sur WhatsApp.'],
    b: [['Être trouvé', 'sur Google.'], ['Inspirer confiance', 'dès le premier contact.'], ['Transformer les visites', 'en clients.']],
    fim: ['Et si on créait', 'le vôtre ?'], fimSub: 'Répondez simplement à ce message.',
  },
}[L];

// ---------- linha do tempo (segundos) ----------
const cenas = [];
let cursor = 0;
const add = (dur, tipo, o = {}) => { cenas.push({ ini: cursor, dur, tipo, ...o }); cursor += dur; };
// abertura: cortes rápidos
[['meridian', 100], ['hm-jardim', 118], ['hs-intro', 185], ['kelle-hero', 118], ['andrade-proj', 95], ['hm-rolo', 28], ['truz-hero', 98]]
  .forEach(([c, f]) => add(0.95, 'abertura', { clip: c, f0: f }));
add(3.4, 'titulo');
add(2.6, 'card', { linhas: T.c1, extra: T.c1b });
// pranchas: alterna ecrã inteiro (A) e prancha com moldura (B)
const pl = [['hm-jardim', 12, 'A'], ['hs-intro', 96, 'B'], ['meridian', 8, 'A'], ['kelle-cap', 8, 'B'], ['andrade-proj', 12, 'A'], ['truz-hero', 18, 'B']];
pl.forEach(([c, f, estilo], i) => add(i === 0 ? 4.2 : 3.6, 'prancha', { clip: c, f0: f, estilo, n: i + 1, legenda: T.pl[i] }));
add(2.3, 'card', { linhas: T.c2 });
add(3.6, 'prancha', { clip: 'hm-proposta', f0: 10, estilo: 'B', n: 0, legenda: '' , rapido: 1.3});
T.b.forEach((b, i) => add(1.9, 'beneficio', { linhas: b, n: i + 1 }));
add(4.2, 'fim');
window.DURACAO = cursor;

const NFR = () => window.NFR || {};
const quadro = (c, f) => `q2/${c}/${String(Math.min(NFR()[c] || 1, Math.max(1, Math.round(f)))).padStart(4, '0')}.jpg`;

const palco = document.getElementById('palco');
const ease = (x) => 1 - Math.pow(1 - Math.min(1, Math.max(0, x)), 3);
// linha que sobe de dentro da máscara: k = tempo local (s), atraso em s
const sobe = (k, atraso) => { const e = ease((k - atraso) / 0.55); return `transform:translateY(${(1 - e) * 105}%)`; };

function html(c, k) {
  const topo = `<div class="topo"><span class="mono">${T.marca}</span><span class="mono">${T.oficio}</span></div>`;
  if (c.tipo === 'abertura') {
    return `<img class="full" src="${quadro(c.clip, c.f0 + k * FPS)}">`;
  }
  if (c.tipo === 'titulo') {
    return `${topo}
      <div style="position:absolute;left:64px;right:64px;top:600px">
        <div class="serif" style="font-size:250px;line-height:.86">
          <span class="linha"><span style="${sobe(k, .1)}">${T.titulo[0]}</span></span>
          <span class="linha"><span style="${sobe(k, .28)}">${T.titulo[1]}</span></span>
        </div>
        <div class="serif" style="font-size:84px;font-style:italic;margin-top:36px;opacity:${ease((k - .8) / .4)}">${T.sub}</div>
      </div>
      <div class="regua" style="top:1640px;transform-origin:left;transform:scaleX(${ease((k - .5) / 1.2)})"></div>
      <div class="mono" style="position:absolute;left:64px;right:64px;top:1672px;font-size:21px;line-height:1.6;opacity:${ease((k - 1.1) / .4)}">${T.subMono}</div>`;
  }
  if (c.tipo === 'card') {
    return `${topo}
      <div class="serif" style="position:absolute;left:64px;right:40px;top:760px;font-size:132px;line-height:.98">
        ${c.linhas.map((l, i) => `<span class="linha"><span style="${sobe(k, .12 + i * .16)}${i === c.linhas.length - 1 ? ';font-style:italic' : ''}">${l}</span></span>`).join('')}
      </div>
      ${c.extra ? `<div class="mono" style="position:absolute;left:64px;top:1180px;font-size:24px;opacity:${ease((k - .9) / .3)}">${c.extra}</div>` : ''}`;
  }
  if (c.tipo === 'prancha') {
    const f = c.f0 + k * FPS * (c.rapido || 1);
    const n = c.n ? `PL. ${String(c.n).padStart(2, '0')} / 06` : ({ pt: 'ORÇAMENTO ONLINE', en: 'ONLINE QUOTE', fr: 'DEVIS EN LIGNE' }[L]);
    if (c.estilo === 'A') {
      return `<img class="full" src="${quadro(c.clip, f)}">
        <div class="selo" style="left:48px;bottom:64px;max-width:900px"><div class="mono">${n}</div>${c.legenda ? `<div class="serif">${c.legenda}</div>` : ''}</div>`;
    }
    // B: prancha com moldura em papel
    return `${topo}
      <div style="position:absolute;left:110px;top:150px;width:860px;height:1529px;overflow:hidden;outline:2px solid var(--tinta);outline-offset:14px">
        <img src="${quadro(c.clip, f)}" style="width:100%;height:100%;object-fit:cover">
      </div>
      <div style="position:absolute;left:96px;right:96px;top:1736px;display:flex;justify-content:space-between;align-items:baseline">
        <span class="serif" style="font-size:48px;font-style:italic">${c.legenda}</span><span class="mono" style="font-size:19px;color:var(--cinza)">${n}</span>
      </div>`;
  }
  if (c.tipo === 'beneficio') {
    return `${topo}
      <div class="mono" style="position:absolute;left:64px;top:700px;color:var(--oxido)">0${c.n} / 03</div>
      <div class="serif" style="position:absolute;left:64px;right:40px;top:770px;font-size:134px;line-height:.98">
        <span class="linha"><span style="${sobe(k, .05)}">${c.linhas[0]}</span></span>
        <span class="linha"><span style="${sobe(k, .18)};font-style:italic">${c.linhas[1]}</span></span>
      </div>`;
  }
  if (c.tipo === 'fim') {
    return `${topo}
      <div class="serif" style="position:absolute;left:64px;right:40px;top:640px;font-size:176px;line-height:.92">
        <span class="linha"><span style="${sobe(k, .1)}">${T.fim[0]}</span></span>
        <span class="linha"><span style="${sobe(k, .26)};font-style:italic">${T.fim[1]}</span></span>
      </div>
      <div class="regua" style="top:1240px;transform-origin:left;transform:scaleX(${ease((k - .6) / 1)})"></div>
      <div class="serif" style="position:absolute;left:64px;top:1290px;font-size:64px;opacity:${ease((k - 1) / .4)}">${T.fimSub}</div>
      <div class="mono" style="position:absolute;left:64px;bottom:120px;font-size:22px;opacity:${ease((k - 1.3) / .4)}">${T.marca} — ${T.oficio}</div>`;
  }
  return '';
}

const X = 0.3; // duração da dissolução entre cenas (s)
window.render = async (t) => {
  const i = Math.max(0, cenas.findIndex((x) => t >= x.ini && t < x.ini + x.dur));
  const c = cenas[i], prox = cenas[i + 1];
  let h = `<div style="position:absolute;inset:0;background:var(--papel)">${html(c, t - c.ini)}</div>`;
  if (prox && t > prox.ini - X) {
    const k = (t - (prox.ini - X)) / X;
    const o = k * k * (3 - 2 * k);
    h += `<div style="position:absolute;inset:0;background:var(--papel);opacity:${o.toFixed(3)}">${html(prox, t - prox.ini)}</div>`;
  }
  palco.innerHTML = h + '<div class="grao"></div>';
  await document.fonts.ready;
  await Promise.all([...palco.querySelectorAll('img')].map((i) => i.decode().catch(() => {})));
};
</script></body></html>
